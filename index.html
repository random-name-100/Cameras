<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Système de Sécurité - Accès Caméras</title>
  <style>
    body { 
      background-color: #0a0a0a; 
      color: #00ff00; 
      font-family: 'Courier New', Courier, monospace; 
      display: flex; 
      height: 100vh; 
      margin: 0; 
    }
    #sidebar { 
      width: 260px; 
      background: #111; 
      border-right: 2px solid #00ff00;
      padding: 20px; 
      overflow-y: auto; 
    }
    #view { 
      flex-grow: 1; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
    }
    details { margin-bottom: 15px; }
    summary { 
      font-weight: bold; 
      padding: 8px; 
      background: #222; 
      cursor: pointer; 
      border: 1px solid #00ff00;
      outline: none;
    }
    .zone { 
      margin: 5px 0 5px 15px; 
      padding: 8px; 
      cursor: pointer; 
      border-left: 2px solid transparent; 
    }
    .zone:hover { 
      border-color: #00ff00; 
      background: #1a1a1a;
      color: #fff;
    }
    
    /* Conteneur de l'écran pour superposer les effets */
    #screen-container {
      position: relative;
      display: inline-block;
      border: 2px solid #333;
      box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
      background: #000;
    }
    img { 
      display: block;
      width: 50vw;
      height: auto;
      max-height: 75vh;
      object-fit: contain;
    }

    /* Effet de lignes cathodiques (Scanlines) */
    .scanlines {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      pointer-events: none; /* Pour pouvoir cliquer au travers si besoin */
    }

    /* Icône REC */
    .overlay-rec { 
      position: absolute; 
      top: 5%; 
      right: 5%; 
      color: red; 
      font-weight: bold; 
      font-size: 1.5em;
      animation: blink 1.5s infinite; 
      display: none;
    }

    /* Texte de chargement sur l'écran */
    #loading-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2em;
      display: none;
      text-shadow: 0 0 10px #00ff00;
    }

    /* Animation du REC */
    @keyframes blink { 50% { opacity: 0; } }

    /* Effet de Grésillement / Glitch aléatoire */
    .glitch-effect {
      animation: random-glitch 4s infinite;
    }
    @keyframes random-glitch {
      0%, 92%, 100% { filter: none; transform: skew(0deg); }
      93% { filter: invert(10%) sepia(50%) hue-rotate(90deg) contrast(150%); transform: skew(2deg) translate(2px, -1px); }
      95% { filter: none; transform: skew(0deg); }
      98% { filter: contrast(150%) grayscale(50%); transform: translate(-3px, 2px); }
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>> TERMINAL_</h2>
    
    <!-- SOUS-SOL -->
    <details>
      <summary>Sous-sol</summary>
      <div class="zone" onclick="changeCam('images/ss-cage.png', 'Sous-sol - Cage')">Cage</div>
      <div class="zone" onclick="changeCam('images/ss-reserve.png', 'Sous-sol - Réserve')">Réserve</div>
      <div class="zone" onclick="changeCam('images/ss-jeux.png', 'Sous-sol - Salle de jeux')">Salle de jeux</div>
    </details>

    <!-- REZ-DE-CHAUSSÉE -->
    <details>
      <summary>Rez-de-chaussée</summary>
      <div class="zone" onclick="changeCam('images/rdc-garage.png', 'RDC - Garage')">Garage</div>
      <div class="zone" onclick="changeCam('images/rdc-stockage.png', 'RDC - Stockage')">Stockage</div>
      <div class="zone" onclick="changeCam('images/rdc-escalier.png', 'RDC - Escalier')">Escalier</div>
    </details>
    
    <!-- ÉTAGE 1 -->
    <details>
      <summary>Étage 1</summary>
      <div class="zone" onclick="changeCam('images/e1-dortoir.png', 'Étage 1 - Dortoir')">Dortoir</div>
      <div class="zone" onclick="changeCam('images/e1-atelier.png', 'Étage 1 - Atelier')">Atelier</div>
      <div class="zone" onclick="changeCam('images/e1-pause.png', 'Étage 1 - Salle de pause')">Salle de pause</div>
    </details>

    <!-- ÉTAGE 2 -->
    <details>
      <summary>Étage 2</summary>
      <div class="zone" onclick="changeCam('images/e2-bureau.png', 'Étage 2 - Bureau')">Bureau</div>
      <div class="zone" onclick="changeCam('images/e2-net.png', 'Étage 2 - Salle Net')">Salle Net</div>
      <div class="zone" onclick="changeCam('images/e2-accestoit.png', 'Étage 2 - Accès toit')">Accès toit</div>
    </details>

    <!-- TOIT -->
    <details>
      <summary>Toit</summary>
      <div class="zone" onclick="changeCam('images/toit.png', 'Toit - Vue globale')">Vue globale</div>
    </details>

  </div>

  <div id="view">
    <h3 id="cam-title">> EN ATTENTE DE CONNEXION...</h3>
    
    <div id="screen-container">
      <img id="cam-img" src="'images/flux.jpg'" alt="Flux vidéo">
      <div class="scanlines"></div>
      <div id="rec-icon" class="overlay-rec">● REC</div>
      <div id="loading-text">CONNEXION...</div>
    </div>
  </div>

  <script>
    let connectionTimeout;

    function changeCam(imgUrl, title) {
      const img = document.getElementById('cam-img');
      const titleEl = document.getElementById('cam-title');
      const recIcon = document.getElementById('rec-icon');
      const loadingText = document.getElementById('loading-text');

      // Annuler une connexion en cours si on clique vite sur une autre caméra
      clearTimeout(connectionTimeout);

      // ÉTAPE 1 : ÉTAT DE CHARGEMENT
      titleEl.innerText = "> ÉTABLISSEMENT DE LA LIAISON : " + title;
      img.src = "https://via.placeholder.com/800x600/000000/000000"; // Écran noir
      img.classList.remove('glitch-effect'); // Pause du glitch
      recIcon.style.display = "none";
      loadingText.style.display = "block";

      // ÉTAPE 2 : AFFICHAGE APRÈS UN DÉLAI (1500 ms = 1.5 secondes)
      connectionTimeout = setTimeout(() => {
        img.src = imgUrl;
        titleEl.innerText = "> CAMÉRA ACTIVE : " + title;
        recIcon.style.display = "block";
        loadingText.style.display = "none";
        img.classList.add('glitch-effect'); // Reprise du glitch
      }, 1500); 
    }
  </script>

</body>
</html>
